name: Desktop Linux e macOS
on:
  # The shared tests the native project compiles (MiniInfos.Desktop.Tests.csproj) count as its own.
  push:
    branches: [dev, main]
    paths: ['desktop/**', 'widget/Providers/**', 'widget/Sources/**', 'widget/Infrastructure/**', 'widget/Settings/**', 'widget/Localization/**', 'widget/Community/**', 'widget/Mascot/**', 'widget/Updates/**', 'widget/UI/Formatting/**', 'widget/UI/Themes/**', 'widget/Assets/**', 'tests/MiniInfos.Tests/Providers/**', 'tests/MiniInfos.Tests/Sources/**', 'tests/MiniInfos.Tests/Infrastructure/Storage/**', 'tests/MiniInfos.Tests/Support/**', 'tests/MiniInfos.Desktop.Tests/**', '.github/workflows/desktop-native.yml']
  pull_request:
    paths: ['desktop/**', 'widget/**', 'tests/MiniInfos.Tests/Providers/**', 'tests/MiniInfos.Tests/Sources/**', 'tests/MiniInfos.Tests/Infrastructure/Storage/**', 'tests/MiniInfos.Tests/Support/**', 'tests/MiniInfos.Desktop.Tests/**', '.github/workflows/desktop-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, runtime: linux-x64 }
          - { os: ubuntu-24.04-arm, runtime: linux-arm64 }
          - { os: macos-15-intel, runtime: osx-x64 }
          - { os: macos-15, runtime: osx-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libx11-6 libice6 libsm6 libfontconfig1 xvfb
      - run: python -m unittest discover -s desktop/packaging/tests -v
      - name: Affected native domains
        id: native-tests
        shell: pwsh
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:GITHUB_REF -eq 'refs/heads/main' -or -not $env:TEST_BASE -or $env:TEST_BASE -match '^0+$') {
            ./desktop/test.ps1 -All
          } else { ./desktop/test.ps1 -Base $env:TEST_BASE }
      - name: Native UI startup without user data
        if: steps.native-tests.outputs.ui == 'true'
        shell: bash
        run: |
          export MINIINFOS_DATA_DIR="$RUNNER_TEMP/miniinfos-smoke"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dotnet run --project desktop -c Release -- --smoke-ui
          else
            dotnet run --project desktop -c Release -- --smoke-ui
          fi
