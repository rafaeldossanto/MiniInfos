name: Front

on:
  push:
    branches: [dev, main]
    paths: ['front/**', 'infra/**', '.github/workflows/front.yml']
  pull_request:
    paths: ['front/**', 'infra/**', '.github/workflows/front.yml']

permissions:
  contents: read

concurrency:
  group: front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    name: Validar landing page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: front
      - run: npm run check
        working-directory: front
