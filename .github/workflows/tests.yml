# Selects affected domains on dev/PRs; main runs the complete unit regression.
# Visual scenarios and the mod stay local: they need an interactive Windows session or Claude Code.
name: Testes

on:
  push:
    branches: [dev, main]
    paths-ignore: ['marketplace/**']
  pull_request:
    paths-ignore: ['marketplace/**']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build e testes de unidade
    # WPF only builds on Windows.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketplace/packages/

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validar seleção de testes
        shell: pwsh
        run: ./tests/TestSelection.Tests.ps1

      - name: Conferir isolamento do instalador e do ZIP de código
        shell: pwsh
        run: ./tests/Packaging.Tests.ps1

      - name: Testes dos domínios afetados
        shell: pwsh
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_FULL: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if ($env:TEST_FULL -eq 'true' -or $env:TEST_BASE -match '^0+$' -or -not $env:TEST_BASE) {
            ./tests/run.ps1 -All
          } else {
            ./tests/run.ps1 -Base $env:TEST_BASE
          }
