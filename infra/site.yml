AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MiniInfos landing page: a private S3 bucket served only through CloudFront, an ACM certificate
  validated by DNS at Cloudflare, and a deploy role that GitHub Actions assumes through OIDC.
  No access keys exist anywhere. Create this stack in us-east-1: CloudFront only takes certificates from there.

Parameters:
  DomainName:
    Type: String
    Default: miniinfos.com
    Description: Apex domain of the site; www.<domain> is redirected to it.
  GitHubRepositorySubject:
    Type: String
    Default: rafaeldossanto@163165658/MiniInfos@1432597159
    AllowedPattern: '[A-Za-z0-9_.-]+@[0-9]+/[A-Za-z0-9_.-]+@[0-9]+'
    Description: >-
      The only repository allowed to deploy, as GitHub's immutable OIDC subject names it: owner@ownerId/name@repoId
      (gh api repos/OWNER/NAME/actions/oidc/customization/sub). The ids keep a recreated namesake out. No wildcards.
  GitHubBranch:
    Type: String
    Default: main
    AllowedPattern: '[A-Za-z0-9_./-]+'
    Description: The only branch allowed to deploy.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: >-
      Leave empty to create the GitHub OIDC provider. An account holds one per URL, so if another stack
      already created it, paste its ARN (IAM > Identity providers) instead.
  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: PriceClass_All includes the South American edges, close to a Brazilian audience.

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']

Resources:
  # --- Certificate: pending until the validation CNAME it shows is added at Cloudflare. ---
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub www.${DomainName}
      ValidationMethod: DNS

  # --- Storage: private, encrypted, versioned so a bad deploy can be rolled back. ---
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only this distribution reads, and only objects: nobody lists the bucket from outside.
          - Sid: CloudFrontReadsThisDistributionOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: DenyPlainHttp
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub ${SiteBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # --- Delivery ---
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # www.<domain> answers with a permanent redirect to the apex. The target is fixed here, never taken
  # from the request's Host, so the function cannot be used as an open redirect.
  WwwRedirect:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-www-redirect
      AutoPublish: true
      FunctionConfig:
        Comment: Redirects www to the apex domain
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host === 'www.${DomainName}') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${DomainName}' + request.uri } },
            };
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${DomainName} landing page
        Aliases:
          - !Ref DomainName
          - !Sub www.${DomainName}
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed CachingOptimized: honors the Cache-Control each file is uploaded with.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed SecurityHeadersPolicy: HSTS, nosniff, frame and referrer protections.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirect.FunctionMetadata.FunctionARN
        # Without ListBucket, a missing file reads as 403 from S3: both become the 404 page, with status 404.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  # --- Deploy from GitHub Actions, without keys ---
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub Publishes ${DomainName} from ${GitHubRepositorySubject} on ${GitHubBranch} and nothing else
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            # Exact matches only: this repository, this branch. A wildcard here would let other repositories in.
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepositorySubject}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListTheSiteBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: WriteTheSiteFiles
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${SiteBucket.Arn}/*
              - Sid: RefreshTheSiteCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  CloudflareTarget:
    Description: Point miniinfos.com and www at this, as CNAMEs set to DNS only (grey cloud).
    Value: !GetAtt Distribution.DomainName
  SiteBucket:
    Description: GitHub repository variable SITE_BUCKET.
    Value: !Ref SiteBucket
  DistributionId:
    Description: GitHub repository variable SITE_DISTRIBUTION_ID.
    Value: !Ref Distribution
  DeployRoleArn:
    Description: GitHub repository secret AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
