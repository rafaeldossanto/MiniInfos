<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <title>Página não encontrada — MiniInfos</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem('miniinfos.site.theme') === 'light')
          document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="container legal-page">
      <a class="brand" href="/"
        ><svg class="brand-icon" aria-hidden="true"><use href="/icons.svg#owl" /></svg>MiniInfos</a
      >
      <p class="eyebrow">404 / Fora de vista</p>
      <h1>Este canto<br />está vazio.</h1>
      <p>
        A página que você procurou não foi encontrada. Volte ao início para conhecer o MiniInfos e
        encontrar o download.
      </p>
      <a class="button" href="/">Voltar ao início</a>
    </main>
  </body>
</html>
